<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>來電送 - 店家接單</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brick: {
              DEFAULT: '#C84B31',
              dark: '#A53B24',
              light: '#FDF4F2'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8F6F4;
      font-family: "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 手繪稿頂部「你的單來囉！」斜線紋理背景 */
    .incoming-order-banner {
      background-color: #C84B31;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.12),
        rgba(255, 255, 255, 0.12) 12px,
        transparent 12px,
        transparent 24px
      );
    }
  </style>
</head>
<body class="text-stone-800 antialiased min-h-screen flex flex-col justify-between selection:bg-red-100 selection:text-brick">

  <!-- ========================================================= -->
  <!-- 頁面 3：店家接單頁面 (Screen 3 - 店家接單 RWD 手機/平板適應) -->
  <!-- ========================================================= -->
  <div id="page-order-accept" class="min-h-screen flex flex-col justify-between pb-10 md:pb-8">
    
    <!-- 頂部品牌與頁面導覽列 (嚴格使用：大 text-xl、中 text-base、小 text-xs) -->
    <header class="w-full bg-white/95 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30 shadow-xs">
      <div class="max-w-xl md:max-w-4xl lg:max-w-5xl mx-auto px-4 md:px-6 min-h-16 md:min-h-20 py-2.5 md:py-0 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
        
        <!-- 品牌專屬向量 Logo (統一使用 CoDeliver-logo-1020x1020px-20261021.svg，鎖定 shrink-0 whitespace-nowrap 防換行) -->
        <a href="index.html" class="flex items-center gap-2.5 cursor-pointer select-none shrink-0">
          <img src="CoDeliver-logo-1020x1020px-20261021.svg" alt="來電送 Logo" class="w-11 h-11 md:w-12 md:h-12 rounded-2xl object-contain shrink-0">
          <div class="shrink-0 whitespace-nowrap">
            <span class="text-xl font-black tracking-tight text-brick leading-none block">來電送</span>
            <span class="text-xs text-stone-500 font-bold tracking-wider block mt-0.5">CALL & DELIVER</span>
          </div>
        </a>

        <!-- 訂單單號切換器 (小螢幕空間不足時自動折至下一行，不切斷) -->
        <div class="w-full sm:w-auto flex flex-wrap items-center justify-end gap-1.5 md:gap-2 border-t border-stone-100 sm:border-t-0 pt-2 sm:pt-0">
          <span class="text-xs text-stone-500 font-bold whitespace-nowrap">單號：</span>
          <button onclick="switchMockOrder(0)" id="mock-btn-0" class="px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-lg text-xs font-bold bg-brick text-white shadow-xs transition active:scale-95">#101</button>
          <button onclick="switchMockOrder(1)" id="mock-btn-1" class="px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-lg text-xs font-bold bg-stone-100 text-stone-600 hover:bg-stone-200 transition active:scale-95">#102</button>
          <button onclick="switchMockOrder(2)" id="mock-btn-2" class="px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-lg text-xs font-bold bg-stone-100 text-stone-600 hover:bg-stone-200 transition active:scale-95">#103</button>
        </div>
      </div>
    </header>

    <!-- 店家接單主視覺容器 (手機單欄 max-w-xl / 平板與桌面寬版雙欄看板 md:max-w-4xl lg:max-w-5xl) -->
    <main class="flex-1 max-w-xl md:max-w-4xl lg:max-w-5xl w-full mx-auto px-4 md:px-6 py-5 md:py-8 flex flex-col justify-center">
      
      <!-- 頂部副標列 (小 text-xs) -->
      <div class="flex items-center justify-between mb-2.5 md:mb-3.5 px-1">
        <h2 class="text-xs font-bold text-stone-600 flex items-center gap-1.5">
          <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-brick"></i> 店家接單通知
        </h2>
        <span id="order-status-badge" class="text-xs font-bold text-brick bg-brick-light px-2.5 py-0.5 rounded-md border border-red-200/60">
          待接單
        </span>
      </div>

      <!-- 接單卡片本體 (對應手繪稿外框) -->
      <div class="bg-white rounded-3xl overflow-hidden shadow-xl shadow-stone-200/70 border border-stone-200/80 flex flex-col">
        
        <!-- 1. 手繪稿頂部橫幅：「你的單來囉！」 (手機置中 / 平板橫向寬幅排布) -->
        <div class="incoming-order-banner px-6 py-7 md:px-8 md:py-6 text-white text-center md:text-left relative overflow-hidden border-b border-red-900/10 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
          <div class="flex items-center justify-center md:justify-start gap-2 order-2 md:order-1">
            <i data-lucide="flame" class="w-6 h-6 shrink-0"></i>
            <h1 class="text-xl font-black tracking-wide drop-shadow-sm">你的單來囉！</h1>
          </div>
          <div class="inline-flex items-center justify-center gap-1.5 bg-black/20 backdrop-blur-xs px-3.5 py-1.5 rounded-full text-xs font-bold self-center md:self-auto order-1 md:order-2">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span id="order-store-name">禾風堂手作便當</span>
            <span>•</span>
            <span id="order-id" class="font-mono">單號 #101</span>
          </div>
        </div>

        <!-- 2. RWD 內容區：手機由上而下單欄 / 平板以上 (md:grid-cols-12) 左右雙欄看板 -->
        <div class="p-5 md:p-7 grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 items-stretch">
          
          <!-- 左欄 (平板占 5/12)：配送時間、收件地址、顧客名/電話 -->
          <div class="md:col-span-5 flex flex-col gap-4 justify-between">
            
            <!-- 項目一：幾點前送到 -->
            <div class="flex items-start gap-3.5 p-3.5 md:p-4 rounded-2xl bg-brick-light/70 border border-red-200/60">
              <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-brick text-white flex items-center justify-center shrink-0 shadow-xs mt-0.5">
                <i data-lucide="clock" class="w-5 h-5"></i>
              </div>
              <div class="flex-1 min-w-0">
                <span class="text-xs font-bold text-stone-500 block">幾點前送到</span>
                <p id="order-deliver-by" class="text-xl font-black text-brick mt-0.5"></p>
              </div>
            </div>

            <!-- 項目二：收件地址 -->
            <div class="flex items-start gap-3.5 p-3.5 md:p-4 rounded-2xl bg-stone-50 border border-stone-200/70 flex-1">
              <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-stone-200/80 text-stone-700 flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="map-pin" class="w-5 h-5 text-brick"></i>
              </div>
              <div class="flex-1 min-w-0">
                <span class="text-xs font-bold text-stone-500 block">收件地址</span>
                <p id="order-address" class="text-base font-black text-stone-900 mt-0.5 leading-snug"></p>
              </div>
            </div>

            <!-- 項目四 (在平板左欄底部、手機透過 order 排在品項之後)：顧客名 / 電話 -->
            <div class="flex items-start gap-3.5 p-3.5 md:p-4 rounded-2xl bg-stone-50 border border-stone-200/70 order-last md:order-none">
              <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-stone-200/80 text-stone-700 flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="user-check" class="w-5 h-5 text-brick"></i>
              </div>
              <div class="flex-1 min-w-0 flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <span class="text-xs font-bold text-stone-500 block">顧客名 / 電話</span>
                  <p id="order-customer" class="text-base font-black text-stone-900 mt-0.5 truncate"></p>
                </div>
                <a id="order-customer-call" href="#" class="px-3 py-2 rounded-xl bg-white border border-stone-200 text-brick text-xs font-bold flex items-center gap-1.5 shadow-xs hover:border-brick transition active:scale-95 shrink-0">
                  <i data-lucide="phone" class="w-3.5 h-3.5"></i> 聯絡顧客
                </a>
              </div>
            </div>

          </div>

          <!-- 右欄 (平板占 7/12)：品項/數量明細 + 應收總計 + 底部「接受訂單！」大按鈕 -->
          <div class="md:col-span-7 flex flex-col justify-between gap-4">
            
            <!-- 項目三：品項 / 數量 -->
            <div class="flex items-start gap-3.5 p-3.5 md:p-5 rounded-2xl bg-stone-50 border border-stone-200/70 flex-1">
              <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-stone-200/80 text-stone-700 flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="utensils" class="w-5 h-5 text-brick"></i>
              </div>
              <div class="flex-1 min-w-0 flex flex-col justify-between h-full">
                <div>
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-stone-500">品項 / 數量</span>
                    <span id="order-total-qty" class="text-xs font-bold text-brick bg-brick-light px-2.5 py-0.5 rounded-md"></span>
                  </div>
                  <div id="order-items-list" class="mt-2.5 space-y-2.5 border-t border-stone-200/80 pt-3">
                    <!-- 動態渲染品項與數量 -->
                  </div>
                </div>
                <div class="mt-4 pt-3 border-t border-stone-200/80 flex items-center justify-between">
                  <span class="text-xs font-bold text-stone-600">應收總計（免外送費）</span>
                  <span id="order-total-price" class="text-xl font-black text-brick font-mono"></span>
                </div>
              </div>
            </div>

            <!-- 3. 手繪稿底部行動按鈕：「接受訂單！」與接單後進度推進控制 -->
            <div class="pt-1 md:pt-0 space-y-2.5">
              <button id="btn-accept-order" onclick="acceptOrder()" class="w-full bg-brick hover:bg-brick-dark active:scale-[0.98] text-white font-black py-4 md:py-4.5 px-6 rounded-full text-xl flex items-center justify-center gap-2.5 shadow-lg shadow-red-950/20 transition cursor-pointer">
                <span class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-base font-mono">$</span>
                <span id="btn-accept-text">接受訂單！</span>
              </button>

              <!-- 接單後：店家端可同步推進配送階段至「顧客追蹤頁」 -->
              <div id="store-stage-controls" class="hidden bg-stone-50 border border-stone-200/80 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs font-bold text-stone-600 flex items-center gap-1">
                  <i data-lucide="radar" class="w-3.5 h-3.5 text-brick"></i> 同步顧客端進度：
                </span>
                <div class="flex items-center gap-1.5">
                  <button id="stage-btn-0" onclick="updateOrderStepFromStore(0)" class="px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">1. 店家接單</button>
                  <button id="stage-btn-1" onclick="updateOrderStepFromStore(1)" class="px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">2. 已製作完成</button>
                  <button id="stage-btn-2" onclick="updateOrderStepFromStore(2)" class="px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">3. 已送達</button>
                </div>
              </div>
            </div>

          </div>

        </div>

      </div>
    </main>

    <!-- 頁尾 (小 text-xs)：角色切換小字連結 -->
    <footer class="w-full text-center py-4 px-4 text-xs text-stone-500 border-t border-stone-200/50 bg-white/50">
      <div class="flex flex-wrap items-center justify-center gap-x-2.5 gap-y-1">
        <span>© 來電送 • 店家接單系統</span>
        <span class="text-stone-300">|</span>
        <a href="index.html" class="hover:text-brick hover:underline">顧客首頁</a>
        <span>·</span>
        <a href="user_order_track.html" class="hover:text-brick hover:underline">訂單追蹤</a>
        <span>·</span>
        <a href="order_accept.html" class="text-brick font-bold hover:underline">店家接單</a>
        <span>·</span>
        <a href="controller.html" class="hover:text-brick hover:underline">後台主控台</a>
      </div>
    </footer>
  </div>

  <!-- ========================================================= -->
  <!-- 已接單回饋畫面彈窗 (Modal - 支援手機與平板寬度)           -->
  <!-- ========================================================= -->
  <div id="modal-accepted" class="fixed inset-0 bg-stone-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm md:max-w-md w-full p-6 md:p-7 text-center shadow-2xl relative">
      <div class="w-14 h-14 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-xs">
        <i data-lucide="check-circle-2" class="w-8 h-8"></i>
      </div>
      <h3 class="text-xl font-black text-stone-900">已成功接受訂單！</h3>
      <p class="text-xs text-stone-600 mt-1">已即時同步至顧客訂單追蹤頁面，請開始備餐</p>

      <!-- 接單摘要區塊 -->
      <div id="modal-accepted-summary" class="text-xs text-stone-700 my-4 leading-relaxed bg-stone-50 p-3.5 md:p-4 rounded-2xl border border-stone-200/80 text-left space-y-1.5">
        <!-- 動態填入接單摘要 -->
      </div>

      <div class="flex gap-2.5">
        <button onclick="closeAcceptedModal()" class="flex-1 py-3 md:py-3.5 bg-brick hover:bg-brick-dark text-white font-bold rounded-xl text-base shadow-md transition active:scale-95 cursor-pointer">
          確認，開始備餐
        </button>
        <a href="user_order_track.html" class="py-3 md:py-3.5 px-4 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl text-xs flex items-center justify-center gap-1 transition active:scale-95">
          <span>查看顧客端</span>
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- JavaScript: 全站共用狀態同步、Web Audio 音效與接單管理    -->
  <!-- ========================================================= -->

          { key: "terms", shortLabel: "條款", fullTitle: "服務條款", updatedAt: "2026/10/21 16:30", content: "1. 訂單確認規範：顧客透過「來電送」送出訂單並經電話確認後，店家即刻開始備餐，恕不接受臨時改單或無故棄單。\n2. 棄單黑名單機制：若顧客累計無故棄單或拒收達 2 次（含）以上，系統管理員有權將該電話號碼列為黑名單並取消其訂餐權限。\n3. 準時專送承諾：合作店家均享免外送費門檻優惠，並於指定午餐時段準時送達。" },

    function loadSharedState() {
      try {
        const raw = localStorage.getItem(SHARED_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.stores && parsed.customers && parsed.orders) {
            return parsed;
          }
        }
      } catch (e) {}
      const def = getDefaultSharedState();
      saveSharedState(def);
      return def;
    }

    function saveSharedState(state) {
      try {
        localStorage.setItem(SHARED_STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    let sharedState = loadSharedState();
    let mockOrdersData = sharedState.orders;
    let currentOrderIdx = 0;
    let audioCtx = null;
    let ringTimer = null;

    // 判斷該訂單所屬店家是否在後台開啟音效提醒
    function isStoreSoundEnabledForOrder(order) {
      if (!order) return false;
      const st = sharedState.stores.find(s => s.id === order.storeId || s.name === order.storeName);
      return st ? st.soundEnabled !== false : true;
    }

    // 實際排程振盪器發出「叮咚」雙連和弦音列
    function scheduleChimeNotes(ctx) {
      const now = ctx.currentTime;
      const notes = [
        { freq: 659.25, start: 0.0,  duration: 0.16 }, // E5
        { freq: 783.99, start: 0.14, duration: 0.16 }, // G5
        { freq: 1046.50, start: 0.28, duration: 0.42 }, // C6
        { freq: 659.25, start: 0.80, duration: 0.16 }, // E5
        { freq: 783.99, start: 0.94, duration: 0.16 }, // G5
        { freq: 1046.50, start: 1.08, duration: 0.55 }  // C6
      ];

      notes.forEach(note => {
        const osc = ctx.createOscillator();
        const harmonic = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(note.freq, now + note.start);

        harmonic.type = 'triangle';
        harmonic.frequency.setValueAtTime(note.freq * 2, now + note.start);

        const harmonicGain = ctx.createGain();
        harmonicGain.gain.setValueAtTime(0.15, now + note.start);

        gain.gain.setValueAtTime(0.001, now + note.start);
        gain.gain.exponentialRampToValueAtTime(0.35, now + note.start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + note.start + note.duration);

        osc.connect(gain);
        harmonic.connect(harmonicGain);
        harmonicGain.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + note.start);
        harmonic.start(now + note.start);
        osc.stop(now + note.start + note.duration + 0.02);
        harmonic.stop(now + note.start + note.duration + 0.02);
      });
    }

    function playIncomingOrderChime() {
      const currentOrder = mockOrdersData[currentOrderIdx];
      if (!currentOrder || currentOrder.accepted) return;
      if (!isStoreSoundEnabledForOrder(currentOrder)) return;

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(() => {
            if (audioCtx.state === 'running' && !mockOrdersData[currentOrderIdx].accepted && isStoreSoundEnabledForOrder(mockOrdersData[currentOrderIdx])) {
              scheduleChimeNotes(audioCtx);
            }
          }).catch(() => {});
          return;
        }
        scheduleChimeNotes(audioCtx);
      } catch (err) {}
    }

    function syncOrderAlertSound() {
      stopOrderAlertSound();
      const order = mockOrdersData[currentOrderIdx];
      if (order && !order.accepted && isStoreSoundEnabledForOrder(order)) {
        playIncomingOrderChime();
        ringTimer = setInterval(() => {
          const currentOrder = mockOrdersData[currentOrderIdx];
          if (currentOrder && !currentOrder.accepted && isStoreSoundEnabledForOrder(currentOrder)) {
            playIncomingOrderChime();
          } else {
            stopOrderAlertSound();
          }
        }, 4500);
      }
    }

    function stopOrderAlertSound() {
      if (ringTimer) {
        clearInterval(ringTimer);
        ringTimer = null;
      }
    }

    function syncFromStorage() {
      sharedState = loadSharedState();
      mockOrdersData = sharedState.orders;
      const targetIdx = mockOrdersData.findIndex(o => o.orderId === sharedState.activeOrderId);
      if (targetIdx !== -1) {
        currentOrderIdx = targetIdx;
      } else if (currentOrderIdx >= mockOrdersData.length) {
        currentOrderIdx = 0;
      }
    }

    // 頁面初始化階段 (window.onload)
    function initOrderPage() {
      syncFromStorage();
      renderOrder();

      const initialOrder = mockOrdersData[currentOrderIdx];
      if (initialOrder && !initialOrder.accepted) {
        syncOrderAlertSound();
      } else {
        stopOrderAlertSound();
      }

      const unlockEvents = ['pointerdown', 'touchstart', 'mousedown', 'keydown'];
      const unlockAudio = (e) => {
        if (e && e.target && e.target.closest && e.target.closest('#btn-accept-order')) {
          removeUnlockListeners();
          return;
        }
        const currentOrder = mockOrdersData[currentOrderIdx];
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().then(() => {
            if (currentOrder && !currentOrder.accepted) {
              syncOrderAlertSound();
            }
          }).catch(() => {});
        } else if (currentOrder && !currentOrder.accepted) {
          syncOrderAlertSound();
        }
        removeUnlockListeners();
      };

      const removeUnlockListeners = () => {
        unlockEvents.forEach(evt => document.removeEventListener(evt, unlockAudio));
      };
      unlockEvents.forEach(evt => document.addEventListener(evt, unlockAudio, { passive: true }));

      // 跨分頁即時監聽：當顧客新下單或後台切換店家靜音時，自動更新畫面與鈴聲
      window.addEventListener('storage', (e) => {
        if (e.key === SHARED_STORAGE_KEY) {
          syncFromStorage();
          renderOrder();
          syncOrderAlertSound();
        }
      });
    }

    function switchMockOrder(idx) {
      currentOrderIdx = idx;
      if (mockOrdersData[idx]) {
        sharedState.activeOrderId = mockOrdersData[idx].orderId;
        saveSharedState(sharedState);
      }
      renderOrder();
      syncOrderAlertSound();
    }

    function renderOrder() {
      const order = mockOrdersData[currentOrderIdx];
      if (!order) return;

      mockOrdersData.forEach((o, idx) => {
        const btn = document.getElementById(`mock-btn-${idx}`);
        if (btn) {
          btn.innerText = o.orderId;
          btn.className = idx === currentOrderIdx
            ? "px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-lg text-xs font-bold bg-brick text-white shadow-xs transition active:scale-95 cursor-pointer"
            : "px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-lg text-xs font-bold bg-stone-100 text-stone-600 hover:bg-stone-200 transition active:scale-95 cursor-pointer";
        }
      });

      document.getElementById('order-store-name').innerText = order.storeName;
      document.getElementById('order-id').innerText = `單號 ${order.orderId}`;
      const deliverText = String(order.deliverBy).includes('前送到') ? order.deliverBy : `${order.deliverBy} 前送到`;
      document.getElementById('order-deliver-by').innerText = deliverText;
      document.getElementById('order-address').innerText = order.address;
      document.getElementById('order-customer').innerText = `${order.customerName} / ${order.customerPhone}`;
      document.getElementById('order-customer-call').href = `tel:${order.customerPhone.replace(/-/g, '')}`;

      let totalQty = 0;
      let totalPrice = 0;
      const itemsHtml = order.items.map(item => {
        totalQty += item.qty;
        const subtotal = item.qty * item.price;
        totalPrice += subtotal;
        return `
          <div class="flex items-center justify-between text-base">
            <span class="font-bold text-stone-800">${item.name}</span>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold bg-white border border-stone-200 text-stone-800 px-2 py-0.5 rounded-md">x ${item.qty}</span>
              <span class="text-xs font-mono font-bold text-stone-600 w-16 text-right">NT$ ${subtotal}</span>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('order-items-list').innerHTML = itemsHtml;
      document.getElementById('order-total-qty').innerText = `共 ${totalQty} 份`;
      document.getElementById('order-total-price').innerText = `NT$ ${totalPrice}`;

      const badge = document.getElementById('order-status-badge');
      const btnAccept = document.getElementById('btn-accept-order');
      const btnAcceptText = document.getElementById('btn-accept-text');
      const stageControls = document.getElementById('store-stage-controls');

      const soundOn = isStoreSoundEnabledForOrder(order);

      if (order.accepted) {
        const stageNames = ["已接單 • 備餐中", "已製作完成 • 配送中", "已送達完成"];
        const curStep = typeof order.step === 'number' ? order.step : 0;
        badge.innerText = stageNames[curStep] || "已接單 • 備餐中";
        badge.className = "text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-0.5 rounded-md border border-emerald-200";
        btnAccept.className = "w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-black py-4 px-6 rounded-full text-xl flex items-center justify-center gap-2.5 shadow-lg transition cursor-pointer";
        btnAcceptText.innerText = "已接受訂單（查看詳情）";
        stageControls.classList.remove('hidden');

        [0, 1, 2].forEach(s => {
          const sBtn = document.getElementById(`stage-btn-${s}`);
          if (sBtn) {
            sBtn.className = s === curStep
              ? "px-2.5 py-1 rounded-lg text-xs font-bold bg-brick text-white shadow-xs transition cursor-pointer"
              : "px-2.5 py-1 rounded-lg text-xs font-bold bg-white border border-stone-200 text-stone-600 hover:border-brick transition cursor-pointer";
          }
        });
      } else {
        badge.innerText = soundOn ? "🔔 待接單 (響鈴提醒中)" : "🔕 待接單 (後台已設靜音)";
        badge.className = "text-xs font-bold text-brick bg-brick-light px-2.5 py-0.5 rounded-md border border-red-200/60";
        btnAccept.className = "w-full bg-brick hover:bg-brick-dark active:scale-[0.98] text-white font-black py-4 px-6 rounded-full text-xl flex items-center justify-center gap-2.5 shadow-lg shadow-red-950/20 transition cursor-pointer";
        btnAcceptText.innerText = "接受訂單！";
        stageControls.classList.add('hidden');
      }

      lucide.createIcons();
    }

    function acceptOrder() {
      const order = mockOrdersData[currentOrderIdx];
      order.accepted = true;
      if (typeof order.step !== 'number') order.step = 0;
      sharedState.activeOrderId = order.orderId;
      saveSharedState(sharedState);

      stopOrderAlertSound();
      renderOrder();

      let totalQty = 0;
      let totalPrice = 0;
      const itemsText = order.items.map(i => {
        totalQty += i.qty;
        totalPrice += i.qty * i.price;
        return `${i.name} × ${i.qty}`;
      }).join('、');

      const deliverText = String(order.deliverBy).includes('前送到') ? order.deliverBy : `${order.deliverBy} 前送到`;

      document.getElementById('modal-accepted-summary').innerHTML = `
        <div><span class="text-stone-500">訂單編號：</span><b class="text-stone-900">${order.orderId} (${order.storeName})</b></div>
        <div><span class="text-stone-500">送達時間：</span><b class="text-brick">${deliverText}</b></div>
        <div><span class="text-stone-500">收件地址：</span><span class="text-stone-900 font-bold">${order.address}</span></div>
        <div><span class="text-stone-500">顧客資訊：</span><span class="text-stone-900 font-bold">${order.customerName} (${order.customerPhone})</span></div>
        <div><span class="text-stone-500">餐點明細：</span><span class="text-stone-800">${itemsText}</span></div>
        <div class="pt-1 border-t border-stone-200/80 text-base font-black text-brick">應收金額：NT$ ${totalPrice} (共 ${totalQty} 份)</div>
      `;

      document.getElementById('modal-accepted').classList.remove('hidden');
      lucide.createIcons();
    }

    // 店家端直接推進配送階段並同步至顧客追蹤頁
    function updateOrderStepFromStore(stepIdx) {
      const order = mockOrdersData[currentOrderIdx];
      if (!order) return;
      order.accepted = true;
      order.step = stepIdx;
      sharedState.activeOrderId = order.orderId;
      saveSharedState(sharedState);
      renderOrder();
    }

    function closeAcceptedModal() {
      document.getElementById('modal-accepted').classList.add('hidden');
    }

    document.getElementById('modal-accepted').addEventListener('click', function(e) {
      if (e.target === this) closeAcceptedModal();
    });

    window.onload = initOrderPage;
  </script>
</body>
</html>
